<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0C1425"/>
      <stop offset="100%" stop-color="#0F2845"/>
    </linearGradient>
    <linearGradient id="wGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFD4FF"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="wGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0.6 0 0.8 0 0  0 0.6 1 0 0  0.8 0.8 1 0 0  0 0 0 0.7 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="barGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- Subtle deep glow behind W -->
  <ellipse cx="128" cy="108" rx="100" ry="58" fill="#4338CA" opacity="0.18"/>
  <ellipse cx="128" cy="108" rx="70"  ry="38" fill="#6366F1" opacity="0.10"/>

  <!-- W — stroke-based, crisp at all sizes -->
  <polyline
    points="28,42  62,162  96,88  128,162  160,88  194,162  228,42"
    fill="none"
    stroke="url(#wGrad)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#wGlow)"/>

  <!-- 7 equalizer bars — heights mirror the W valleys/peaks -->
  <!-- Bottom-aligned at y=222; x positions centered: start=33, step=29, width=16 -->
  <g filter="url(#barGlow)">
    <rect x="33"  y="202" width="16" height="20" rx="8" fill="url(#waveGrad)" opacity="0.72"/>
    <rect x="62"  y="191" width="16" height="31" rx="8" fill="url(#waveGrad)" opacity="0.85"/>
    <rect x="91"  y="179" width="16" height="43" rx="8" fill="url(#waveGrad)"/>
    <rect x="120" y="187" width="16" height="35" rx="8" fill="url(#waveGrad)" opacity="0.92"/>
    <rect x="149" y="179" width="16" height="43" rx="8" fill="url(#waveGrad)"/>
    <rect x="178" y="191" width="16" height="31" rx="8" fill="url(#waveGrad)" opacity="0.85"/>
    <rect x="207" y="202" width="16" height="20" rx="8" fill="url(#waveGrad)" opacity="0.72"/>
  </g>
</svg>
