services:
  fast-whisper-api-gpu:
    build:
      context: .
      args:
        VARIANT: gpu
    profiles:
      - api-gpu
    command: uvicorn api_server:app --host 0.0.0.0 --port 5000
    environment:
      - WHISPER_MODEL=small
      - DEVICE=cuda
      - COMPUTE_TYPE=float16
      - BEAM_SIZE=5
      - MODEL_CACHE=/models
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "5000:5000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    volumes:
      - ../../models/fast-whisper:/models
      - ./api_server.py:/app/api_server.py:ro

  fast-whisper-api-cpu:
    build:
      context: .
      args:
        VARIANT: cpu
    profiles:
      - api-cpu
    command: uvicorn api_server:app --host 0.0.0.0 --port 5000
    environment:
      - WHISPER_MODEL=small
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - BEAM_SIZE=1
      - MODEL_CACHE=/models
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "5000:5000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    volumes:
      - ../../models/fast-whisper:/models
      - ./api_server.py:/app/api_server.py:ro
